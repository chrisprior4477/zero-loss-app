  <text x="392" y="235" fill="#66dcff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" letter-spacing="6">FUEL + CONVENIENCE</text>
  <text x="84" y="580" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="142" font-weight="900" letter-spacing="-8">$50</text>
  <text x="92" y="646" fill="#fff" fill-opacity=".76" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">DIGITAL GIFT CARD</text>
