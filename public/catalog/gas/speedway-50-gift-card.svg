    <path d="M69 69h90v126H69zM87 88h54v43H87zM159 90h21l26 31v57c0 24 35 24 35 0v-31" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="18"/>
  </g>
