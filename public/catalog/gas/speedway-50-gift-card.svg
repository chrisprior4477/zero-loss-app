<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">$50 Speedway fuel and convenience gift card</title>
  <desc id="desc">A blue, red and white digital reward card with a fuel pump and speed stripe illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0565a9"/><stop offset=".52" stop-color="#053a76"/><stop offset="1" stop-color="#021a3b"/></linearGradient>
    <radialGradient id="glow" cx="78%" cy="10%" r="72%"><stop stop-color="#29c8ff" stop-opacity=".55"/><stop offset="1" stop-color="#29c8ff" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1200" height="760" rx="72" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="72" fill="url(#glow)"/>
  <g transform="skewX(-22)" opacity=".9"><rect x="700" y="380" width="670" height="42" fill="#fff"/><rect x="660" y="442" width="690" height="42" fill="#ed1b2f"/><rect x="620" y="504" width="710" height="42" fill="#fff"/></g>
  <g transform="translate(84 88)" filter="url(#shadow)">
