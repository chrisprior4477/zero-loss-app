name: CI

# Runs on every push to any branch, on pull requests, and on demand. The point
# is that neither the secret scan nor the tests depend on a developer having
# husky, gitleaks, Docker or the Supabase CLI installed locally — a commit made
# with --no-verify, or from a machine with no hooks at all, is still scanned
# here before anyone relies on it.
#
# Note that this reports, it does not gate: until these checks are marked as
# required in branch protection, a red run does not stop a push to main. That
# is a deliberate, separate decision.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required, not an optimisation to drop later.
          # .gitleaksignore holds fingerprints scoped to a specific commit +
          # file + rule + line; under the default shallow clone those commits
          # are absent, the fingerprints match nothing, and the scan is not
          # scanning what it claims to be scanning.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # Pinned, and matches the version installed locally so CI and the
          # pre-commit hook cannot disagree about what counts as a leak.
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # The archive must keep its published filename: sha256sum -c reads
          # the name out of the checksums line and opens that file, so saving
          # it as anything else makes verification fail to find it.
          tar_name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tar_name"   "${base}/${tar_name}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tar_name}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tar_name" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Deliberately the same npm script the pre-commit hook and a developer
      # would run, so there is one definition of the scan rather than two that
      # drift apart.
      - name: Scan repository history
        run: npm run scan:secrets

  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Read from .nvmrc so the Node version has one definition shared by
          # CI and anyone running nvm locally.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run test:run

  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # Only Postgres and Auth are started. gotrue is kept deliberately: it
      # applies the auth schema migrations, and the suite inserts into
      # auth.users to exercise the on_auth_user_created trigger. Everything
      # else (Studio, PostgREST, Kong, Realtime, Storage, edge runtime, ...)
      # is dead weight for pg_prove. Measured locally: ~37s to start, against
      # roughly two minutes for the full stack.
      - name: Start database
        run: |
          supabase start -x studio,realtime,storage-api,imgproxy,logflare,vector,supavisor,mailpit,edge-runtime,postgrest,postgres-meta,kong

      # Applies every migration from scratch and then runs the 71 pgTAP
      # assertions, so this also proves the migration chain is replayable in
      # order on a clean database.
      - name: Run pgTAP suite
        run: supabase test db

      - name: Stop database
        if: always()
        run: supabase stop --no-backup
